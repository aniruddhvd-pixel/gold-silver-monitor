name: Update Gold Silver Rates

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Goodreturns rates
        run: |
          python - <<'PY'
          import re
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from urllib.request import Request, urlopen

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140.0 Safari/537.36"
          }

          def fetch(url):
              req = Request(url, headers=headers)
              with urlopen(req, timeout=30) as response:
                  if response.status != 200:
                      raise RuntimeError(f"HTTP {response.status}")
                  return response.read().decode("utf-8", errors="ignore")

          def clean(text):
              text = re.sub(r"<script.*?</script>", " ", text, flags=re.I | re.S)
              text = re.sub(r"<style.*?</style>", " ", text, flags=re.I | re.S)
              text = re.sub(r"<[^>]+>", " ", text)
              text = text.replace("&nbsp;", " ")
              text = text.replace("&#8377;", "₹")
              text = re.sub(r"\s+", " ", text)
              return text

          gold_html = fetch(
              "https://www.goodreturns.in/gold-rates/bangalore.html"
          )

          silver_html = fetch(
              "https://www.goodreturns.in/silver-rates/bangalore.html"
          )

          gold = clean(gold_html)
          silver = clean(silver_html)

          # Goodreturns introductory sentence:
          # ₹15,344 per gram for 24 karat gold
          # ₹14,065 per gram for 22 karat gold
          # ₹11,508 per gram for 18 karat gold

          gold_pattern = re.compile(
              r"₹\s*([\d,]+(?:\.\d+)?)\s*per\s+gram\s+for\s+24\s+karat\s+gold"
              r".*?"
              r"₹\s*([\d,]+(?:\.\d+)?)\s*per\s+gram\s+for\s+22\s+karat\s+gold"
              r".*?"
              r"₹\s*([\d,]+(?:\.\d+)?)\s*per\s+gram\s+for\s+18\s+karat\s+gold",
              re.IGNORECASE
          )

          match = gold_pattern.search(gold)

          if not match:
              raise RuntimeError(
                  "Could not find the 24K/22K/18K gold rates in Goodreturns page"
              )

          gold24 = float(match.group(1).replace(",", ""))
          gold22 = float(match.group(2).replace(",", ""))
          gold18 = float(match.group(3).replace(",", ""))

          # Silver introductory sentence:
          # ₹245 per gram and ₹2,45,000 per kilogram

          silver_pattern = re.compile(
              r"₹\s*([\d,]+(?:\.\d+)?)\s*per\s+gram"
              r".*?"
              r"₹\s*([\d,]+(?:\.\d+)?)\s*per\s+kilogram",
              re.IGNORECASE
          )

          silver_match = silver_pattern.search(silver)

          if not silver_match:
              raise RuntimeError(
                  "Could not find the silver rate in Goodreturns page"
              )

          silver_rate = float(
              silver_match.group(1).replace(",", "")
          )

          # Safety checks so incorrect 10g/1kg values are never committed.
          if not (
              10000 <= gold24 <= 50000
              and 10000 <= gold22 <= 50000
              and 5000 <= gold18 <= 40000
              and 50 <= silver_rate <= 1000
              and gold24 > gold22 > gold18
          ):
              raise RuntimeError(
                  f"Unexpected rates detected: "
                  f"24K={gold24}, 22K={gold22}, "
                  f"18K={gold18}, silver={silver_rate}"
              )

          rates = {
              "gold24": gold24,
              "gold22": gold22,
              "gold18": gold18,
              "silver": silver_rate,
              "updated": datetime.now(
                  ZoneInfo("Asia/Kolkata")
              ).isoformat()
          }

          print("FINAL RATES:")
          print(json.dumps(rates, indent=2))

          with open("rates.json", "w") as f:
              json.dump(rates, f, indent=2)
              f.write("\n")
          PY

      - name: Commit updated rates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rates.json
          git diff --cached --quiet || git commit -m "Update metal rates"
          git push

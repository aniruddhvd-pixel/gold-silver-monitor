name: Update Gold Silver Rates

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Goodreturns rates
        run: |
          python - <<'PY'
          import json
          import re
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from urllib.request import Request, urlopen

          def fetch(url):
              req = Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0"
                  }
              )
              with urlopen(req, timeout=60) as response:
                  if response.status != 200:
                      raise RuntimeError(
                          f"HTTP {response.status}"
                      )
                  return response.read().decode(
                      "utf-8",
                      errors="ignore"
                  )

          gold_url = (
              "https://r.jina.ai/"
              "https://www.goodreturns.in/"
              "gold-rates/bangalore.html"
          )

          silver_url = (
              "https://r.jina.ai/"
              "https://www.goodreturns.in/"
              "silver-rates/bangalore.html"
          )

          gold = fetch(gold_url)
          silver = fetch(silver_url)

          print("Goodreturns gold page fetched:", len(gold))
          print("Goodreturns silver page fetched:", len(silver))

          # Find the Bangalore gold table.
          gold24_match = re.search(
              r"Bangalore\s*\|\s*₹?([\d,]+)"
              r"\s*\|\s*₹?([\d,]+)"
              r"\s*\|\s*₹?([\d,]+)",
              gold,
              re.IGNORECASE
          )

          if not gold24_match:
              # Fallback: find the three 1-gram values
              values = re.findall(
                  r"₹\s*([\d,]+)",
                  gold
              )

              numbers = [
                  int(x.replace(",", ""))
                  for x in values
              ]

              candidates = []

              for i in range(len(numbers) - 2):
                  a, b, c = numbers[i:i+3]

                  if (
                      10000 <= a <= 30000
                      and 10000 <= b <= 30000
                      and 5000 <= c <= 20000
                      and a > b > c
                  ):
                      candidates.append((a, b, c))

              if not candidates:
                  raise RuntimeError(
                      "Could not locate Bangalore gold rates"
                  )

              gold24, gold22, gold18 = candidates[0]

          else:
              gold24 = int(
                  gold24_match.group(1).replace(",", "")
              )
              gold22 = int(
                  gold24_match.group(2).replace(",", "")
              )
              gold18 = int(
                  gold24_match.group(3).replace(",", "")
              )

          # Silver: look specifically for the
          # Silver /g value.
          silver_match = re.search(
              r"Silver\s*/g\s*\|\s*₹?\s*([\d,]+)",
              silver,
              re.IGNORECASE
          )

          if silver_match:
              silver_rate = int(
                  silver_match.group(1).replace(",", "")
              )
          else:
              # Fallback: look for the sentence
              # describing silver per gram.
              silver_match = re.search(
                  r"silver.*?"
                  r"₹\s*([\d,]+)\s*per\s+gram",
                  silver,
                  re.IGNORECASE | re.DOTALL
              )

              if not silver_match:
                  raise RuntimeError(
                      "Could not locate Bangalore silver rate"
                  )

              silver_rate = int(
                  silver_match.group(1).replace(",", "")
              )

          # Safety checks.
          if not (
              10000 <= gold24 <= 30000
              and 10000 <= gold22 <= 30000
              and 5000 <= gold18 <= 20000
              and gold24 > gold22 > gold18
              and 50 <= silver_rate <= 1000
          ):
              raise RuntimeError(
                  "Unexpected values detected: "
                  f"24K={gold24}, "
                  f"22K={gold22}, "
                  f"18K={gold18}, "
                  f"silver={silver_rate}"
              )

          rates = {
              "gold24": gold24,
              "gold22": gold22,
              "gold18": gold18,
              "silver": silver_rate,
              "updated": datetime.now(
                  ZoneInfo("Asia/Kolkata")
              ).isoformat()
          }

          print("FINAL RATES:")
          print(json.dumps(rates, indent=2))

          with open("rates.json", "w") as f:
              json.dump(rates, f, indent=2)
              f.write("\n")
          PY

      - name: Commit updated rates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rates.json
          git diff --cached --quiet || git commit -m "Update metal rates"
          git push

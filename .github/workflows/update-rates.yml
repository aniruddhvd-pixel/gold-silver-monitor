name: Update Gold Silver Rates

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Goodreturns rates
        run: |
          python - <<'PY'
          import json
          import re
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from urllib.request import Request, urlopen
          from html.parser import HTMLParser

          HEADERS = {
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) "
                  "Chrome/140.0 Safari/537.36"
              ),
              "Accept": (
                  "text/html,application/xhtml+xml,"
                  "application/xml;q=0.9,*/*;q=0.8"
              ),
              "Accept-Language": "en-US,en;q=0.9",
              "Referer": "https://www.google.com/"
          }

          def fetch(url):
              request = Request(url, headers=HEADERS)

              for attempt in range(3):
                  try:
                      with urlopen(request, timeout=45) as response:
                          if response.status != 200:
                              raise RuntimeError(
                                  f"HTTP {response.status}"
                              )

                          return response.read().decode(
                              "utf-8",
                              errors="ignore"
                          )

                  except Exception as error:
                      if attempt == 2:
                          raise RuntimeError(
                              f"Unable to fetch Goodreturns: {error}"
                          )

          class TableParser(HTMLParser):

              def __init__(self):
                  super().__init__()
                  self.tables = []
                  self.current_table = None
                  self.current_row = None
                  self.current_cell = None
                  self.cell_text = []

              def handle_starttag(self, tag, attrs):

                  if tag == "table":
                      self.current_table = []

                  elif tag == "tr" and self.current_table is not None:
                      self.current_row = []

                  elif tag in ("td", "th") and self.current_row is not None:
                      self.current_cell = []
                      self.cell_text = []

              def handle_data(self, data):

                  if self.current_cell is not None:
                      self.cell_text.append(data)

              def handle_endtag(self, tag):

                  if tag in ("td", "th"):
                      if (
                          self.current_cell is not None
                          and self.current_row is not None
                      ):
                          text = " ".join(
                              self.cell_text
                          )

                          text = re.sub(
                              r"\s+",
                              " ",
                              text
                          ).strip()

                          self.current_row.append(text)

                      self.current_cell = None
                      self.cell_text = []

                  elif tag == "tr":
                      if (
                          self.current_row is not None
                          and self.current_table is not None
                      ):
                          if self.current_row:
                              self.current_table.append(
                                  self.current_row
                              )

                      self.current_row = None

                  elif tag == "table":
                      if self.current_table is not None:
                          self.tables.append(
                              self.current_table
                          )

                      self.current_table = None

          def rupee_number(text):
              match = re.search(
                  r"(?:₹|Rs\.?|INR)\s*"
                  r"([\d,]+(?:\.\d+)?)",
                  text,
                  re.IGNORECASE
              )

              if not match:
                  return None

              return float(
                  match.group(1).replace(",", "")
              )

          # --------------------------------------------------
          # FETCH
          # --------------------------------------------------

          print("Fetching Goodreturns gold page...")

          gold_html = fetch(
              "https://www.goodreturns.in/"
              "gold-rates/bangalore.html"
          )

          print(
              "Gold page fetched:",
              len(gold_html),
              "characters"
          )

          print("Fetching Goodreturns silver page...")

          silver_html = fetch(
              "https://www.goodreturns.in/"
              "silver-rates/bangalore.html"
          )

          print(
              "Silver page fetched:",
              len(silver_html),
              "characters"
          )

          # --------------------------------------------------
          # PARSE GOLD TABLES
          # --------------------------------------------------

          gold_parser = TableParser()
          gold_parser.feed(gold_html)

          gold24 = None
          gold22 = None
          gold18 = None

          for table in gold_parser.tables:

              for row in table:

                  if not row:
                      continue

                  # We specifically want the 1 gram row.
                  first = row[0].strip()

                  if first != "1":
                      continue

                  numbers = []

                  for cell in row[1:]:
                      value = rupee_number(cell)

                      if value is not None:
                          numbers.append(value)

                  # The correct gold row has:
                  # 24K, 22K, 18K
                  #
                  # Example:
                  # 1 | ₹15,344 (+27) |
                  # ₹14,065 (+25) |
                  # ₹11,508 (+20)

                  if len(numbers) >= 3:

                      a = numbers[0]
                      b = numbers[1]
                      c = numbers[2]

                      if (
                          10000 <= a <= 30000
                          and 10000 <= b <= 30000
                          and 5000 <= c <= 20000
                          and a > b > c
                      ):
                          gold24 = a
                          gold22 = b
                          gold18 = c
                          break

              if gold24 is not None:
                  break

          if gold24 is None:
              raise RuntimeError(
                  "Could not find the 1 gram gold table row"
              )

          print("Gold 24K:", gold24)
          print("Gold 22K:", gold22)
          print("Gold 18K:", gold18)

          # --------------------------------------------------
          # PARSE SILVER TABLE
          # --------------------------------------------------

          silver_parser = TableParser()
          silver_parser.feed(silver_html)

          silver_rate = None

          for table in silver_parser.tables:

              for row in table:

                  if not row:
                      continue

                  # Silver table has:
                  #
                  # 1 | ₹245 | ₹245 | 0
                  #
                  # We want the first cell = 1.

                  if row[0].strip() != "1":
                      continue

                  if len(row) < 2:
                      continue

                  value = rupee_number(row[1])

                  if value is None:
                      continue

                  if 50 <= value <= 1000:
                      silver_rate = value
                      break

              if silver_rate is not None:
                  break

          if silver_rate is None:
              raise RuntimeError(
                  "Could not find the 1 gram silver table row"
              )

          print("Silver:", silver_rate)

          # --------------------------------------------------
          # FINAL SAFETY CHECK
          # --------------------------------------------------

          if not (
              10000 <= gold24 <= 30000
              and 10000 <= gold22 <= 30000
              and 5000 <= gold18 <= 20000
              and gold24 > gold22 > gold18
          ):
              raise RuntimeError(
                  "Invalid gold values detected: "
                  f"{gold24}, {gold22}, {gold18}"
              )

          if not (
              50 <= silver_rate <= 1000
          ):
              raise RuntimeError(
                  f"Invalid silver value detected: {silver_rate}"
              )

          # --------------------------------------------------
          # WRITE rates.json
          # --------------------------------------------------

          rates = {
              "gold24": gold24,
              "gold22": gold22,
              "gold18": gold18,
              "silver": silver_rate,
              "updated": datetime.now(
                  ZoneInfo("Asia/Kolkata")
              ).isoformat()
          }

          print("")
          print("==============================")
          print("FINAL RATES")
          print("==============================")
          print(
              json.dumps(
                  rates,
                  indent=2
              )
          )
          print("==============================")

          with open("rates.json", "w") as file:
              json.dump(
                  rates,
                  file,
                  indent=2
              )
              file.write("\n")

          print("rates.json created successfully")
          PY

      - name: Commit updated rates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add rates.json

          git diff --cached --quiet || \
            git commit -m "Update metal rates"

          git push

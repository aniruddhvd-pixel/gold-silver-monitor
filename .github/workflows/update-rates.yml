name: Update Gold Silver Rates

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Goodreturns rates
        run: |
          python - <<'PY'
          import json
          import re
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from urllib.request import Request, urlopen

          HEADERS = {
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) "
                  "Chrome/140.0 Safari/537.36"
              )
          }

          def fetch(url):
              request = Request(url, headers=HEADERS)

              with urlopen(request, timeout=60) as response:
                  if response.status != 200:
                      raise RuntimeError(
                          f"HTTP {response.status}"
                      )

                  return response.read().decode(
                      "utf-8",
                      errors="ignore"
                  )

          def clean(text):
              text = text.replace("\r", " ")
              text = text.replace("\n", " ")
              text = text.replace("\t", " ")
              text = text.replace("&nbsp;", " ")
              text = text.replace("&#8377;", "₹")
              text = text.replace("&#x20B9;", "₹")

              text = re.sub(
                  r"<script.*?</script>",
                  " ",
                  text,
                  flags=re.IGNORECASE | re.DOTALL
              )

              text = re.sub(
                  r"<style.*?</style>",
                  " ",
                  text,
                  flags=re.IGNORECASE | re.DOTALL
              )

              text = re.sub(
                  r"<[^>]+>",
                  " ",
                  text
              )

              text = re.sub(
                  r"\s+",
                  " ",
                  text
              )

              return text.strip()

          gold_url = (
              "https://r.jina.ai/"
              "https://www.goodreturns.in/"
              "gold-rates/bangalore.html"
          )

          silver_url = (
              "https://r.jina.ai/"
              "https://www.goodreturns.in/"
              "silver-rates/bangalore.html"
          )

          print("Fetching Goodreturns gold page...")
          gold_html = fetch(gold_url)

          print("Fetching Goodreturns silver page...")
          silver_html = fetch(silver_url)

          gold = clean(gold_html)
          silver = clean(silver_html)

          print(
              "Goodreturns gold page fetched:",
              len(gold)
          )

          print(
              "Goodreturns silver page fetched:",
              len(silver)
          )

          # --------------------------------------------------
          # GOLD
          # --------------------------------------------------

          gold24 = None
          gold22 = None
          gold18 = None

          # First try the explicit Goodreturns sentence.
          gold_sentence = re.search(
              r"gold price in Bangalore.*?"
              r"₹\s*([\d,]+(?:\.\d+)?)"
              r"\s*per\s+gram.*?"
              r"24\s*karat\s+gold.*?"
              r"₹\s*([\d,]+(?:\.\d+)?)"
              r"\s*per\s+gram.*?"
              r"22\s*karat\s+gold.*?"
              r"₹\s*([\d,]+(?:\.\d+)?)"
              r"\s*per\s+gram.*?"
              r"18\s*karat\s+gold",
              gold,
              flags=re.IGNORECASE | re.DOTALL
          )

          if gold_sentence:
              gold24 = float(
                  gold_sentence.group(1).replace(",", "")
              )

              gold22 = float(
                  gold_sentence.group(2).replace(",", "")
              )

              gold18 = float(
                  gold_sentence.group(3).replace(",", "")
              )

          # Second method: find the actual /g labels.
          if gold24 is None:
              match24 = re.search(
                  r"24K\s*Gold\s*/g.{0,250}?"
                  r"₹\s*([\d,]+(?:\.\d+)?)",
                  gold,
                  flags=re.IGNORECASE | re.DOTALL
              )

              match22 = re.search(
                  r"22K\s*Gold\s*/g.{0,250}?"
                  r"₹\s*([\d,]+(?:\.\d+)?)",
                  gold,
                  flags=re.IGNORECASE | re.DOTALL
              )

              match18 = re.search(
                  r"18K\s*Gold\s*/g.{0,250}?"
                  r"₹\s*([\d,]+(?:\.\d+)?)",
                  gold,
                  flags=re.IGNORECASE | re.DOTALL
              )

              if match24 and match22 and match18:
                  gold24 = float(
                      match24.group(1).replace(",", "")
                  )

                  gold22 = float(
                      match22.group(1).replace(",", "")
                  )

                  gold18 = float(
                      match18.group(1).replace(",", "")
                  )

          if gold24 is None:
              raise RuntimeError(
                  "Could not locate Bangalore 24K/22K/18K gold rates"
              )

          print("Gold 24K:", gold24)
          print("Gold 22K:", gold22)
          print("Gold 18K:", gold18)

          # --------------------------------------------------
          # SILVER
          # --------------------------------------------------

          silver_rate = None

          # Look directly after the Silver /g label.
          silver_per_gram = re.search(
              r"Silver\s*/g.{0,250}?"
              r"₹\s*([\d,]+(?:\.\d+)?)",
              silver,
              flags=re.IGNORECASE | re.DOTALL
          )

          if silver_per_gram:
              silver_rate = float(
                  silver_per_gram.group(1).replace(",", "")
              )

          # Fallback: Goodreturns sentence.
          if silver_rate is None:
              silver_sentence = re.search(
                  r"price\s+of\s+silver\s+in\s+Bangalore"
                  r".{0,500}?"
                  r"₹\s*([\d,]+(?:\.\d+)?)"
                  r"\s*per\s+gram",
                  silver,
                  flags=re.IGNORECASE | re.DOTALL
              )

              if silver_sentence:
                  silver_rate = float(
                      silver_sentence.group(1).replace(",", "")
                  )

          if silver_rate is None:
              raise RuntimeError(
                  "Could not locate Bangalore silver rate"
              )

          print("Silver:", silver_rate)

          # --------------------------------------------------
          # SAFETY CHECKS
          # --------------------------------------------------

          if not (
              10000 <= gold24 <= 30000
              and 10000 <= gold22 <= 30000
              and 5000 <= gold18 <= 20000
              and gold24 > gold22 > gold18
          ):
              raise RuntimeError(
                  "Invalid gold values detected: "
                  f"24K={gold24}, "
                  f"22K={gold22}, "
                  f"18K={gold18}"
              )

          if not (
              50 <= silver_rate <= 1000
          ):
              raise RuntimeError(
                  "Invalid silver value detected: "
                  f"{silver_rate}"
              )

          # --------------------------------------------------
          # CREATE rates.json
          # --------------------------------------------------

          rates = {
              "gold24": gold24,
              "gold22": gold22,
              "gold18": gold18,
              "silver": silver_rate,
              "updated": datetime.now(
                  ZoneInfo("Asia/Kolkata")
              ).isoformat()
          }

          print("")
          print("================================")
          print("FINAL RATES")
          print("================================")
          print(json.dumps(rates, indent=2))
          print("================================")

          with open("rates.json", "w") as file:
              json.dump(
                  rates,
                  file,
                  indent=2
              )
              file.write("\n")

          print("rates.json created successfully")
          PY

      - name: Commit updated rates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add rates.json

          git diff --cached --quiet || \
            git commit -m "Update metal rates"

          git push

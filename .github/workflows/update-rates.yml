name: Update Gold Silver Rates

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Goodreturns rates
        run: |
          python - <<'PY'
          import re
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from urllib.request import Request, urlopen

          headers = {
              "User-Agent": "Mozilla/5.0"
          }

          def fetch(url):
              req = Request(url, headers=headers)
              with urlopen(req, timeout=30) as response:
                  return response.read().decode("utf-8", errors="ignore")

          gold_html = fetch(
              "https://www.goodreturns.in/gold-rates/bangalore.html"
          )

          silver_html = fetch(
              "https://www.goodreturns.in/silver-rates/bangalore.html"
          )

          def clean(text):
              text = re.sub(r"<[^>]+>", " ", text)
              text = text.replace("&nbsp;", " ")
              text = re.sub(r"\s+", " ", text)
              return text

          gold = clean(gold_html)
          silver = clean(silver_html)

          def get_gold_rate(text, karat):
              pattern = (
                  rf"{karat}K\s+Gold\s*/g\s*"
                  rf"₹\s*([\d,]+(?:\.\d+)?)"
              )

              match = re.search(pattern, text, re.IGNORECASE)

              if not match:
                  raise RuntimeError(
                      f"Could not find {karat}K gold rate"
                  )

              return float(
                  match.group(1).replace(",", "")
              )

          def get_silver_rate(text):
              pattern = (
                  r"Silver\s*/g\s*"
                  r"₹\s*([\d,]+(?:\.\d+)?)"
              )

              match = re.search(
                  pattern,
                  text,
                  re.IGNORECASE
              )

              if not match:
                  raise RuntimeError(
                      "Could not find silver rate"
                  )

              return float(
                  match.group(1).replace(",", "")
              )

          gold24 = get_gold_rate(gold, 24)
          gold22 = get_gold_rate(gold, 22)
          gold18 = get_gold_rate(gold, 18)
          silver = get_silver_rate(silver)

          rates = {
              "gold24": gold24,
              "gold22": gold22,
              "gold18": gold18,
              "silver": silver,
              "updated": datetime.now(
                  ZoneInfo("Asia/Kolkata")
              ).isoformat()
          }

          print(rates)

          with open("rates.json", "w") as f:
              json.dump(rates, f, indent=2)
              f.write("\n")
          PY

      - name: Commit updated rates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rates.json
          git diff --cached --quiet || git commit -m "Update metal rates"
          git push
